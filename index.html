<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Yappy Shan</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;height:100dvh;background:#FF9FCE;display:flex;align-items:stretch;justify-content:center;font-family:ui-rounded,"Hiragino Maru Gothic ProN",ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  #wrap{position:relative;width:100%;height:100%;height:100dvh;max-width:calc(100dvh * 2 / 3);margin:0 auto;}
  canvas{display:block;width:100%;height:100%;cursor:pointer;}
  #mute{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:rgba(255,111,165,.85);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #lb-btn{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:rgba(255,111,165,.85);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

  /* overlay panels */
  #overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:rgba(107,35,80,.82);backdrop-filter:blur(4px);}
  #overlay.show{display:flex;}
  #overlay h2{font-size:28px;font-weight:700;color:#FFD86B;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,.4);}
  #overlay p.sub{font-size:14px;color:#FFE1F0;margin-bottom:20px;}
  #name-input{width:100%;max-width:260px;padding:12px 16px;border-radius:40px;border:2px solid #FF6FA5;background:#fff;font-size:18px;font-family:inherit;text-align:center;color:#6B2350;outline:none;margin-bottom:12px;}
  #name-input:focus{border-color:#FFD86B;}
  .btn{padding:12px 32px;border-radius:40px;border:none;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .1s;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:#FF4D9B;color:#fff;box-shadow:0 4px 14px rgba(255,77,155,.4);}
  .btn-secondary{background:rgba(255,255,255,.18);color:#FFE1F0;margin-top:8px;}
  #lb-table{width:100%;max-width:320px;margin-top:4px;}
  .lb-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:14px;margin-bottom:6px;background:rgba(255,255,255,.10);}
  .lb-row.gold{background:rgba(255,216,107,.22);}
  .lb-row.silver{background:rgba(200,200,220,.15);}
  .lb-row.bronze{background:rgba(210,150,80,.15);}
  .lb-rank{font-size:18px;width:28px;text-align:center;flex-shrink:0;}
  .lb-name{flex:1;font-size:15px;font-weight:600;color:#FFE1F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lb-score{font-size:16px;font-weight:800;color:#FFD86B;}
  .lb-empty{font-size:14px;color:#FFB3D4;text-align:center;padding:20px 0;}
  .lb-loading{font-size:14px;color:#FFB3D4;text-align:center;padding:20px 0;animation:pulse 1s ease-in-out infinite alternate;}
  @keyframes pulse{from{opacity:.5}to{opacity:1}}
  #err-msg{font-size:13px;color:#FF8FC0;margin-top:8px;text-align:center;min-height:18px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="lb-btn" aria-label="Leaderboard">🏆</button>
  <button id="mute" aria-label="Toggle sound">♪</button>

  <!-- shared overlay: name-entry OR leaderboard -->
  <div id="overlay">
    <!-- Name entry panel -->
    <div id="panel-name" style="display:none;flex-direction:column;align-items:center;width:100%;">
      <h2>✨ Score: <span id="final-score-display"></span></h2>
      <p class="sub" id="new-best-label"></p>
      <input id="name-input" type="text" maxlength="16" placeholder="Your name" autocomplete="off" spellcheck="false">
      <div id="err-msg"></div>
      <button class="btn btn-primary" id="submit-btn">Submit score</button>
      <button class="btn btn-secondary" id="skip-btn">Skip</button>
    </div>

    <!-- Leaderboard panel -->
    <div id="panel-lb" style="display:none;flex-direction:column;align-items:center;width:100%;">
      <h2>🏆 Top 10</h2>
      <p class="sub">Yappy Shan global leaderboard</p>
      <div id="lb-table"></div>
      <button class="btn btn-primary" id="close-lb-btn" style="margin-top:18px;">Play</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ═══════════════════════════════════════════
   LEADERBOARD — Google Apps Script
   Paste your deployed web app URL below
═══════════════════════════════════════════ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5ZYQrUSQovywXJBnliuWDBXKVDe2Z82V5rp5QJwQbcaatA4cpj08_NWjkzZxdwHQY/exec";
/* ══════════════════════════════════════════ */

/* ---------- Leaderboard helpers ---------- */
async function fetchLeaderboard(){
  const res = await fetch(SCRIPT_URL + "?action=get&cachebust=" + Date.now());
  if (!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  return JSON.parse(text);
}
async function submitScore(name, score){
  const url = SCRIPT_URL + "?action=post&name=" + encodeURIComponent(name.trim()) + "&score=" + encodeURIComponent(score);
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  return JSON.parse(text);
}

/* ---------- overlay helpers ---------- */
const overlay    = document.getElementById("overlay");
const panelName  = document.getElementById("panel-name");
const panelLb    = document.getElementById("panel-lb");
const lbTable    = document.getElementById("lb-table");
const nameInput  = document.getElementById("name-input");
const errMsg     = document.getElementById("err-msg");
const submitBtn  = document.getElementById("submit-btn");
const skipBtn    = document.getElementById("skip-btn");
const closeLbBtn = document.getElementById("close-lb-btn");
const lbBtn      = document.getElementById("lb-btn");

function showOverlay(panel){
  overlay.classList.add("show");
  panelName.style.display = panel === "name" ? "flex" : "none";
  panelLb.style.display   = panel === "lb"   ? "flex" : "none";
}
function hideOverlay(){
  overlay.classList.remove("show");
}

const MEDALS = ["🥇","🥈","🥉"];
const ROW_CLASS = ["gold","silver","bronze"];
function renderLeaderboard(rows){
  if (!rows || rows.length === 0){
    lbTable.innerHTML = '<div class="lb-empty">No scores yet — be the first! 🌸</div>';
    return;
  }
  lbTable.innerHTML = rows.map((r,i) => `
    <div class="lb-row ${ROW_CLASS[i]||''}">
      <span class="lb-rank">${MEDALS[i] || (i+1)}</span>
      <span class="lb-name">${escHtml(r.name)}</span>
      <span class="lb-score">${r.score}</span>
    </div>`).join("");
}
function escHtml(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function openLeaderboard(){
  showOverlay("lb");
  lbTable.innerHTML = '<div class="lb-loading">Loading…</div>';
  try{
    const rows = await fetchLeaderboard();
    renderLeaderboard(rows);
  }catch(e){
    lbTable.innerHTML = '<div class="lb-empty">Couldn\'t load scores. Check your connection.</div>';
  }
}

lbBtn.addEventListener("click", e => { e.stopPropagation(); openLeaderboard(); });
closeLbBtn.addEventListener("click", e => { e.stopPropagation(); hideOverlay(); });
overlay.addEventListener("click", e => e.stopPropagation());

/* name entry */
function openNameEntry(score, isNewBest){
  document.getElementById("final-score-display").textContent = score;
  document.getElementById("new-best-label").textContent = isNewBest ? "🌟 New personal best!" : "Submit your score to the leaderboard";
  errMsg.textContent = "";
  nameInput.value = localStorage.getItem("yappy-shan-name") || "";
  showOverlay("name");
  setTimeout(() => nameInput.focus(), 120);
}

submitBtn.addEventListener("click", async e => {
  e.stopPropagation();
  const name = nameInput.value.trim();
  if (!name){ errMsg.textContent = "Enter your name first 🌸"; return; }
  errMsg.textContent = "";
  submitBtn.disabled = true; submitBtn.textContent = "Submitting…";
  try{
    await submitScore(name, pendingScore);
    localStorage.setItem("yappy-shan-name", name);
    hideOverlay();
    await openLeaderboard();
  }catch(err){
    errMsg.textContent = "Error: " + (err.message || "couldn't submit — check your connection.");
  } finally {
    submitBtn.disabled = false; submitBtn.textContent = "Submit score";
  }
});
skipBtn.addEventListener("click", e => { e.stopPropagation(); hideOverlay(); });
nameInput.addEventListener("keydown", e => { if(e.key==="Enter") submitBtn.click(); });

/* ---------- world constants ---------- */
const W=480,H=720,DECK_H=92,SKY_H=H-DECK_H;
const GRAVITY=1600,FLAP=-520,MAX_FALL=950;
const SHIP_X=132,SHIP_R=13;
const GAP_START=190,GAP_MIN=136,GAP_STEP=2.2;
const SPD_START=158,SPD_MAX=232,SPD_STEP=1.6;
const SPACING=300,TOWER_W=66,MARGIN=74,MAX_RISE=118;
const STEP=1/120;

/* ---------- canvas ---------- */
const cv=document.getElementById("game");
const ctx=cv.getContext("2d");
function resize(){
  const r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  ctx.setTransform(cv.width/W,0,0,cv.width/W,0,0);
}
addEventListener("resize",resize);

/* ---------- fairy synth ---------- */
let ac=null,muted=false;
function initAc(){
  if(!ac){ ac=new(window.AudioContext||window.webkitAudioContext)(); }
  if(ac.state==="suspended") ac.resume();
}
/* sparkle: two sine oscillators a major third apart, short attack, quick fade */
function fairySparkle(rootFreq, dur, vol){
  if(muted) return;
  try{
    initAc();
    const t=ac.currentTime;
    [[rootFreq,1],[rootFreq*1.26,0.55],[rootFreq*1.5,0.35]].forEach(([freq,relVol],i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type="sine";
      o.frequency.setValueAtTime(freq*0.98, t+i*0.018);
      o.frequency.linearRampToValueAtTime(freq*1.04, t+i*0.018+dur*0.3);
      o.frequency.exponentialRampToValueAtTime(freq*1.01, t+i*0.018+dur);
      g.gain.setValueAtTime(0, t+i*0.018);
      g.gain.linearRampToValueAtTime(vol*relVol, t+i*0.018+0.018);
      g.gain.exponentialRampToValueAtTime(0.0001, t+i*0.018+dur);
      o.connect(g).connect(ac.destination);
      o.start(t+i*0.018); o.stop(t+i*0.018+dur+0.05);
    });
  }catch(e){}
}
/* wish-granted: ascending glittery arpeggio */
function wishGranted(){
  if(muted) return;
  try{
    initAc();
    const t=ac.currentTime;
    const notes=[523,659,784,1047,1319]; // C5 E5 G5 C6 E6
    notes.forEach((freq,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type="sine";
      o.frequency.setValueAtTime(freq, t+i*0.07);
      o.frequency.linearRampToValueAtTime(freq*1.008, t+i*0.07+0.18);
      g.gain.setValueAtTime(0, t+i*0.07);
      g.gain.linearRampToValueAtTime(0.07, t+i*0.07+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+i*0.07+0.32);
      // shimmer: add a faint octave above
      const o2=ac.createOscillator(), g2=ac.createGain();
      o2.type="sine"; o2.frequency.value=freq*2;
      g2.gain.setValueAtTime(0, t+i*0.07);
      g2.gain.linearRampToValueAtTime(0.025, t+i*0.07+0.02);
      g2.gain.exponentialRampToValueAtTime(0.0001, t+i*0.07+0.22);
      o.connect(g).connect(ac.destination);
      o2.connect(g2).connect(ac.destination);
      o.start(t+i*0.07); o.stop(t+i*0.07+0.4);
      o2.start(t+i*0.07); o2.stop(t+i*0.07+0.3);
    });
  }catch(e){}
}
/* death tumble: descending chromatic slide */
function deathSound(){
  if(muted) return;
  try{
    initAc();
    const t=ac.currentTime;
    const o=ac.createOscillator(), g=ac.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(540, t);
    o.frequency.exponentialRampToValueAtTime(140, t+0.45);
    g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.48);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t+0.5);
    // sad low thud
    const o2=ac.createOscillator(), g2=ac.createGain();
    o2.type="sine"; o2.frequency.setValueAtTime(120,t+0.05);
    o2.frequency.exponentialRampToValueAtTime(60,t+0.35);
    g2.gain.setValueAtTime(0.06,t+0.05);
    g2.gain.exponentialRampToValueAtTime(0.0001,t+0.38);
    o2.connect(g2).connect(ac.destination);
    o2.start(t+0.05); o2.stop(t+0.4);
  }catch(e){}
}
/* keep blip as alias so existing call-sites still work */
function blip(freq,dur,type,vol){ fairySparkle(freq,dur,vol); }
document.getElementById("mute").addEventListener("click",e=>{
  e.stopPropagation();muted=!muted;
  e.currentTarget.textContent=muted?"✕":"♪";
  e.currentTarget.blur();
});

/* ---------- best score ---------- */
let best=0;
try{best=parseInt(localStorage.getItem("yappy-shan-best")||"0",10)||0;}catch(e){}
function saveBest(){try{localStorage.setItem("yappy-shan-best",String(best));}catch(e){}}

/* ---------- state ---------- */
const READY=0,PLAYING=1,DEAD=2;
let state=READY,ship,towers,sparks,score,speed,scroll,shake,flash,deadAt,tGlobal,pendingScore=0;
const PETAL_COLORS=["#FFFFFF","#FFD3E8","#FFF0B8","#E6D2FF"];
const flowers=[];
for(let i=0;i<26;i++) flowers.push({x:Math.random()*W,y:20+Math.random()*(SKY_H-60),z:Math.random()<.45?.14:(Math.random()<.6?.28:.46),s:7+Math.random()*13,rot:Math.random()*Math.PI,spin:(Math.random()-.5)*.5,c:PETAL_COLORS[(Math.random()*PETAL_COLORS.length)|0]});
const twinkles=[];
for(let i=0;i<34;i++) twinkles.push({x:Math.random()*W,y:Math.random()*SKY_H,z:.2+Math.random()*.4,r:1+Math.random()*1.8,p:Math.random()*6});

function reset(){
  ship={x:SHIP_X,y:SKY_H*.42,py:SKY_H*.42,vy:0,thrust:0};
  towers=[];sparks=[];score=0;speed=SPD_START;scroll=0;
  shake=0;flash=0;tGlobal=0;state=READY;
}
function gapNow(){return Math.max(GAP_MIN,GAP_START-score*GAP_STEP);}
function addTower(){
  const gap=gapNow(),lo=MARGIN+gap/2,hi=SKY_H-MARGIN-gap/2;
  let c=towers.length?Math.max(lo,Math.min(hi,towers[towers.length-1].c+(Math.random()*2-1)*MAX_RISE)):SKY_H*.5;
  const x=towers.length?towers[towers.length-1].x+SPACING:W+140;
  towers.push({x,px:x,c,gap,scored:false});
}

/* ---------- input ---------- */
function flap(){
  if(overlay.classList.contains("show"))return;
  if(state===READY){state=PLAYING;ship.vy=FLAP;ship.thrust=1;addTower();addTower();addTower();emit(7,150);fairySparkle(740,0.18,0.06);}
  else if(state===PLAYING){ship.vy=FLAP;ship.thrust=1;emit(7,150);fairySparkle(700,0.15,0.05);}
  else if(state===DEAD&&tGlobal-deadAt>0.55&&!overlay.classList.contains("show")){reset();}
}
cv.addEventListener("pointerdown",e=>{e.preventDefault();flap();});
addEventListener("keydown",e=>{if((e.code==="Space"||e.code==="ArrowUp"||e.code==="Enter")&&!overlay.classList.contains("show")){e.preventDefault();if(!e.repeat)flap();}});

/* ---------- particles ---------- */
function emit(n,spread){
  for(let i=0;i<n;i++){
    const k=Math.random();
    sparks.push({x:ship.x-10,y:ship.y+8,vx:-80-Math.random()*110,vy:(Math.random()-.5)*spread,life:.45+Math.random()*.4,age:0,r:2+Math.random()*3,rot:Math.random()*Math.PI,spin:(Math.random()-.5)*6,kind:k<.34?"heart":(k<.7?"petal":"star"),c:PETAL_COLORS[(Math.random()*PETAL_COLORS.length)|0]});
  }
}
function burst(){
  for(let i=0;i<52;i++){
    const a=Math.random()*Math.PI*2,s=60+Math.random()*300;
    sparks.push({x:ship.x,y:ship.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.55+Math.random()*.6,age:0,r:2+Math.random()*4,rot:Math.random()*Math.PI,spin:(Math.random()-.5)*8,kind:Math.random()<.5?"heart":"petal",c:Math.random()<.5?"#FF6FA5":PETAL_COLORS[(Math.random()*PETAL_COLORS.length)|0]});
  }
}

/* ---------- collision ---------- */
function hitsRect(cx,cy,r,rx,ry,rw,rh){const nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh)),dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r;}

/* ---------- update ---------- */
function update(dt){
  tGlobal+=dt;ship.py=ship.y;
  if(shake>0)shake=Math.max(0,shake-dt*3.2);
  if(flash>0)flash=Math.max(0,flash-dt*3.5);
  ship.thrust=Math.max(0,ship.thrust-dt*4.5);
  for(const f of flowers)f.rot+=f.spin*dt;
  if(state===READY){ship.y=SKY_H*.42+Math.sin(tGlobal*2.6)*11;scroll+=42*dt;if(Math.random()<dt*6)emit(1,60);}
  if(state===PLAYING){
    speed=Math.min(SPD_MAX,SPD_START+score*SPD_STEP);scroll+=speed*dt;
    ship.vy=Math.min(MAX_FALL,ship.vy+GRAVITY*dt);ship.y+=ship.vy*dt;
    if(ship.y<SHIP_R){ship.y=SHIP_R;ship.vy=0;}
    for(const t of towers){t.px=t.x;t.x-=speed*dt;}
    if(towers.length&&towers[towers.length-1].x<W-SPACING)addTower();
    if(towers.length&&towers[0].x<-TOWER_W-60)towers.shift();
    for(const t of towers){
      if(!t.scored&&t.x+TOWER_W<ship.x){t.scored=true;score++;if(score%5===0)wishGranted();else fairySparkle(880+Math.min(score,12)*30,0.22,0.07);}
      const top=t.c-t.gap/2,bot=t.c+t.gap/2;
      if(hitsRect(ship.x,ship.y,SHIP_R,t.x,-200,TOWER_W,top+200)||hitsRect(ship.x,ship.y,SHIP_R,t.x,bot,TOWER_W,SKY_H-bot))die();
    }
    if(ship.y+SHIP_R>=SKY_H)die();
  }
  if(state===DEAD){ship.vy=Math.min(MAX_FALL,ship.vy+GRAVITY*dt);ship.y+=ship.vy*dt;if(ship.y>SKY_H-SHIP_R){ship.y=SKY_H-SHIP_R;ship.vy=0;}}
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.age+=dt;if(p.age>=p.life){sparks.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=210*dt;p.vx*=(1-1.6*dt);p.rot+=p.spin*dt;}
}

function die(){
  if(state!==PLAYING)return;
  state=DEAD;deadAt=tGlobal;shake=1;flash=1;burst();deathSound();
  const isNewBest=score>best;
  if(isNewBest){best=score;saveBest();}
  pendingScore=score;
  // show name entry after brief pause so death animation plays
  setTimeout(()=>{
    if(score>0) openNameEntry(score,isNewBest);
  },900);
}

/* ---------- drawing ---------- */
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function heartPath(x,y,s){ctx.beginPath();ctx.arc(x-s*.42,y-s*.25,s*.5,Math.PI*.95,Math.PI*2.05);ctx.arc(x+s*.42,y-s*.25,s*.5,Math.PI*.95,Math.PI*2.05);ctx.lineTo(x,y+s*.95);ctx.closePath();}
function petalPath(x,y,s){ctx.beginPath();ctx.ellipse(x,y,s,s*.55,0,0,Math.PI*2);}
function starPath(x,y,s){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=(i%2===0)?s:s*.34;i===0?ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r):ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();}
function flowerShape(x,y,s,color,center){ctx.fillStyle=color;for(let i=0;i<5;i++){const a=i*Math.PI*2/5;ctx.beginPath();ctx.ellipse(x+Math.cos(a)*s*.62,y+Math.sin(a)*s*.62,s*.5,s*.38,a,0,Math.PI*2);ctx.fill();}ctx.fillStyle=center;ctx.beginPath();ctx.arc(x,y,s*.3,0,Math.PI*2);ctx.fill();}

function drawPrincess(x,y,angle,thrust){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  if(thrust>0.05){ctx.globalAlpha=thrust*.5;ctx.fillStyle="#FFF3C4";for(let i=0;i<3;i++){starPath(-20-i*9,(i-1)*4,4-i);ctx.fill();}ctx.globalAlpha=1;}
  const g=ctx.createLinearGradient(0,-6,-18,18);g.addColorStop(0,"#FF7FBC");g.addColorStop(1,"#FF2E86");ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(4,-3);ctx.quadraticCurveTo(-6,4,-22,12);ctx.quadraticCurveTo(-10,18,6,12);ctx.quadraticCurveTo(9,4,4,-3);ctx.closePath();ctx.fill();
  ctx.fillStyle="#FFD3E8";ctx.beginPath();ctx.moveTo(-22,12);ctx.quadraticCurveTo(-10,18,6,12);ctx.quadraticCurveTo(-8,21,-22,15);ctx.closePath();ctx.fill();
  ctx.fillStyle="#5B3A2E";ctx.beginPath();ctx.moveTo(2,-8);ctx.quadraticCurveTo(-14,-12,-24,-2);ctx.quadraticCurveTo(-12,-2,0,-1);ctx.closePath();ctx.fill();
  ctx.fillStyle="#FF4D9B";roundRect(-1,-8,9,12,3.5);ctx.fill();
  ctx.fillStyle="#FFE9A8";ctx.fillRect(-1,-2.5,9,2);
  ctx.strokeStyle="#FFDCC2";ctx.lineWidth=3;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(6,-4);ctx.lineTo(15,-9);ctx.stroke();
  ctx.strokeStyle="#FFE9A8";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(14,-8);ctx.lineTo(22,-14);ctx.stroke();
  ctx.fillStyle="#FFD86B";starPath(23,-15,4.5);ctx.fill();
  ctx.fillStyle="#FFDCC2";ctx.beginPath();ctx.arc(6,-13,7.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#5B3A2E";ctx.beginPath();ctx.arc(6,-13,7.4,Math.PI*.92,Math.PI*2.12);ctx.fill();
  ctx.beginPath();ctx.ellipse(.5,-12,3.4,5.4,.35,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#4A2B3A";ctx.beginPath();ctx.arc(9.4,-13,1.1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(5.4,-13.4,1.1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(255,111,165,.55)";ctx.beginPath();ctx.arc(10.4,-10.4,1.8,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#D4657F";ctx.lineWidth=1;ctx.beginPath();ctx.arc(7.6,-10.6,2,.2,Math.PI-.4);ctx.stroke();
  ctx.fillStyle="#FFD86B";ctx.beginPath();ctx.moveTo(1.5,-18.4);ctx.lineTo(3.6,-23);ctx.lineTo(5.7,-18.8);ctx.lineTo(7.8,-23.6);ctx.lineTo(9.9,-18.6);ctx.lineTo(11.6,-22);ctx.lineTo(12.2,-17.6);ctx.closePath();ctx.fill();
  ctx.fillStyle="#FF4D9B";ctx.beginPath();ctx.arc(7.8,-20.2,1.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawTower(t,x){
  const top=t.c-t.gap/2,bot=t.c+t.gap/2;
  const sticks=(y,h,dir)=>{
    const g=ctx.createLinearGradient(x,0,x+TOWER_W,0);
    g.addColorStop(0,"#C2915C");g.addColorStop(.22,"#EBC08A");g.addColorStop(.72,"#E3B27A");g.addColorStop(1,"#B9884F");
    ctx.fillStyle=g;ctx.fillRect(x,y,TOWER_W,h);
    ctx.fillStyle="rgba(150,105,58,.55)";for(let i=1;i<4;i++)ctx.fillRect(x+i*TOWER_W/4-1,y,2,h);
    ctx.fillStyle="rgba(140,95,50,.30)";for(let sy=y+10;sy<y+h;sy+=19)for(let i=0;i<4;i++)ctx.fillRect(x+6+i*TOWER_W/4,sy+(i%2)*7,4,2.5);
    const capH=30,capY=dir>0?y+h-capH:y;
    const cg=ctx.createLinearGradient(x,0,x+TOWER_W,0);cg.addColorStop(0,"#E64C8C");cg.addColorStop(.3,"#FF8FC0");cg.addColorStop(.75,"#FF6FA5");cg.addColorStop(1,"#DB3F7E");
    ctx.fillStyle=cg;ctx.fillRect(x,capY,TOWER_W,capH);
    const edge=dir>0?capY+capH:capY;
    ctx.beginPath();ctx.moveTo(x,edge);for(let i=0;i<5;i++){const cx0=x+i*TOWER_W/5,cx1=x+(i+1)*TOWER_W/5;ctx.quadraticCurveTo((cx0+cx1)/2,edge+dir*(i%2?8:4.5),cx1,edge);}
    ctx.lineTo(x+TOWER_W,edge-dir*2);ctx.lineTo(x,edge-dir*2);ctx.closePath();ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.8)";for(let i=0;i<6;i++){ctx.fillRect(x+7+((i*13.7)%(TOWER_W-14)),capY+7+((i*9.3)%(capH-14)),4,2);}
    ctx.fillStyle="rgba(255,255,255,.35)";ctx.fillRect(x+6,capY+3,5,capH-6);
  };
  sticks(-40,top+40,1);sticks(bot,SKY_H-bot,-1);
  const cup=(y,h)=>{ctx.fillStyle="#FFFDF8";roundRect(x-8,y,TOWER_W+16,h,7);ctx.fill();ctx.fillStyle="#FF4D9B";ctx.fillRect(x-8,y+h*.32,TOWER_W+16,h*.3);ctx.fillStyle="#FFD86B";for(let i=0;i<5;i++)ctx.fillRect(x-5+i*14,y+h*.68,8,4);ctx.fillStyle="rgba(107,35,80,.10)";ctx.fillRect(x-8,y+h-4,TOWER_W+16,4);};
  if(top>34)cup(0,34);if(SKY_H-bot>34)cup(SKY_H-34,34);
}

function centerText(str,y,size,weight,color,opts){
  const o=opts||{};
  const fam=o.serif?'Georgia,"Iowan Old Style","Times New Roman",serif':'ui-rounded,"Hiragino Maru Gothic ProN",ui-sans-serif,system-ui,-apple-system,sans-serif';
  ctx.font=`${o.italic?"italic ":""}${weight} ${size}px ${fam}`;
  ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.lineJoin="round";
  if(o.outline){ctx.strokeStyle=o.outline;ctx.lineWidth=o.outlineW||6;ctx.strokeText(str,W/2,y);}
  ctx.fillStyle=color;ctx.fillText(str,W/2,y);
}

function render(alpha){
  ctx.save();
  if(shake>0){const m=shake*shake*9;ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m);}
  const sky=ctx.createLinearGradient(0,0,0,SKY_H);sky.addColorStop(0,"#FFEAF5");sky.addColorStop(.55,"#FFC3E1");sky.addColorStop(1,"#FF9FCE");ctx.fillStyle=sky;ctx.fillRect(0,0,W,SKY_H);
  ctx.globalAlpha=.5;flowerShape(W*.78,SKY_H*.2,92,"rgba(255,255,255,.55)","rgba(255,231,150,.85)");ctx.globalAlpha=1;
  for(const s of twinkles){const x=((s.x-scroll*s.z)%(W+20)+W+20)%(W+20)-10;ctx.globalAlpha=.35+Math.abs(Math.sin(tGlobal*1.6+s.p))*.5;ctx.fillStyle="#FFFFFF";starPath(x,s.y,s.r*1.7);ctx.fill();}ctx.globalAlpha=1;
  for(const f of flowers){const x=((f.x-scroll*f.z)%(W+80)+W+80)%(W+80)-40;ctx.save();ctx.globalAlpha=.35+f.z;ctx.translate(x,f.y);ctx.rotate(f.rot);flowerShape(0,0,f.s,f.c,"#FFD86B");ctx.restore();}ctx.globalAlpha=1;
  for(const t of towers)drawTower(t,t.px+(t.x-t.px)*alpha);
  for(const p of sparks){const k=1-p.age/p.life;ctx.save();ctx.globalAlpha=k;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.kind==="heart"?"#FF6FA5":p.c;if(p.kind==="heart")heartPath(0,0,p.r*1.4*k);else if(p.kind==="star")starPath(0,0,p.r*1.3*k);else petalPath(0,0,p.r*1.2*k);ctx.fill();ctx.restore();}ctx.globalAlpha=1;
  const sy=ship.py+(ship.y-ship.py)*alpha;
  const ang=state===READY?Math.sin(tGlobal*2.6)*.1:Math.max(-.5,Math.min(1.0,Math.atan2(ship.vy,460)));
  if(state!==DEAD||tGlobal-deadAt<0.12)drawPrincess(ship.x,sy,ang,ship.thrust);
  ctx.fillStyle="#F4A9CE";ctx.fillRect(0,SKY_H,W,DECK_H);
  ctx.fillStyle="#FFFDF8";ctx.beginPath();ctx.moveTo(0,SKY_H+8);for(let x=0;x<=W;x+=24)ctx.quadraticCurveTo(x+12,SKY_H-6,x+24,SKY_H+8);ctx.lineTo(W,SKY_H);ctx.lineTo(0,SKY_H);ctx.closePath();ctx.fill();
  ctx.fillStyle="#E784B6";ctx.fillRect(0,SKY_H+10,W,3);
  const off=scroll%60;for(let x=-60-off;x<W+60;x+=60){ctx.strokeStyle="#7BC49A";ctx.lineWidth=3;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x+18,SKY_H+62);ctx.lineTo(x+18,SKY_H+34);ctx.stroke();ctx.beginPath();ctx.moveTo(x+44,SKY_H+62);ctx.lineTo(x+44,SKY_H+42);ctx.stroke();flowerShape(x+18,SKY_H+32,10,"#FFFDF8","#FFD86B");flowerShape(x+44,SKY_H+40,8,"#FF6FA5","#FFE9A8");}
  ctx.fillStyle="rgba(255,255,255,.16)";for(let x=0;x<W;x+=18)ctx.fillRect(x,SKY_H+70,9,DECK_H-70);
  if(state===PLAYING)centerText(String(score),110,78,800,"#FFFFFF",{outline:"#6B2350",outlineW:8});
  if(state===READY){
    centerText("Yappy Shan",206,52,700,"#FFFFFF",{serif:true,italic:true,outline:"#6B2350",outlineW:7});
    ctx.fillStyle="#FF4D9B";heartPath(W/2-96,190,13);ctx.fill();heartPath(W/2+96,190,13);ctx.fill();
    centerText("Tap or press space to flutter up.",250,16,600,"#6B2350");
    centerText("Slip through the Yan Yan sticks.",274,16,600,"#6B2350");
    if(best>0)centerText("Best "+best,318,17,800,"#C42D72");
  }
  if(state===DEAD&&!overlay.classList.contains("show")){
    ctx.fillStyle="rgba(107,35,80,.55)";ctx.fillRect(0,0,W,H);
    if(tGlobal-deadAt>0.55){
      ctx.globalAlpha=.6+Math.sin(tGlobal*4)*.4;
      centerText("Tap to fly again",498,18,700,"#FFFFFF");
      ctx.globalAlpha=1;
    }
  }
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.45})`;ctx.fillRect(0,0,W,H);}
  ctx.restore();
}

let last=performance.now(),acc=0;
function frame(now){let dt=(now-last)/1000;last=now;if(dt>.25)dt=.25;acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP;}render(acc/STEP);requestAnimationFrame(frame);}

resize();reset();
requestAnimationFrame(frame);
})();
</script>
